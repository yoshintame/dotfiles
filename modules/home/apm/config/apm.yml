name: yoshintame-global
version: 1.0.0
targets:
- claude
- codex
dependencies:
  apm:
  - git: https://github.com/yoshintame/agent-skills.git
    ref: ^1.0.0
  - git: https://github.com/senate-exchange/ai-skills.git
    ref: ^1.1.0
  - git: https://github.com/anthropics/skills.git
    ref: main
    skills:
    - docx
    - pdf
    - pptx
    - xlsx
  mcp:
  - name: chrome-devtools
    registry: false
    transport: stdio
    command: bunx
    args:
    - -y
    - chrome-devtools-mcp@latest
    - --browser-url=http://127.0.0.1:9222
  - name: answeroverflow
    registry: false
    transport: http
    url: https://www.answeroverflow.com/mcp
  - name: grafana-monitor
    registry: false
    transport: http
    url: https://grafana-tjtqs92jvneqfmpy.senateexchange.com/mcp-grafana/mcp
    headers:
      Authorization: Bearer ${GRAFANA_MCP_GATEWAY_TOKEN}
      X-Grafana-Service-Account-Token: ${GRAFANA_SERVICE_ACCOUNT_TOKEN}
    extra:
      bearer_token_env_var: GRAFANA_MCP_GATEWAY_TOKEN
      env_http_headers:
        X-Grafana-Service-Account-Token: GRAFANA_SERVICE_ACCOUNT_TOKEN
  - name: grafana-homelab
    registry: false
    transport: http
    url: https://lasthaze-homelab.alpine-ulmer.ts.net:8445/mcp
    headers:
      X-Grafana-Service-Account-Token: ${HOMELAB_GRAFANA_SERVICE_ACCOUNT_TOKEN}
    extra:
      env_http_headers:
        X-Grafana-Service-Account-Token: HOMELAB_GRAFANA_SERVICE_ACCOUNT_TOKEN
  - name: metabase
    registry: false
    transport: http
    url: https://mb.senateexchange.com/api/metabase-mcp
  - name: linear
    registry: false
    transport: http
    url: https://mcp.linear.app/mcp
  - name: tana-local
    registry: false
    transport: http
    url: http://127.0.0.1:8262/mcp
    headers:
      Authorization: Bearer ${TANA_MCP_TOKEN}
    extra:
      bearer_token_env_var: TANA_MCP_TOKEN
