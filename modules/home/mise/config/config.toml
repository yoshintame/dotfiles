[task_config]
includes = [
  "/Users/yoshintame/.config/mise/tasks/rp.toml",
  "/Users/yoshintame/.config/mise/tasks/dot.toml",
]

[tools]
"pipx:apm-cli" = "0.29.1"
bun = "latest"
go = "latest"
hk = "2.6.0"
node = "lts"
npm = "latest"
pnpm = "latest"
python = "latest"
rust = "latest"
uv = "latest"

[settings]
all_compile = false
python.uv_venv_auto = true
color_theme = "catppuccin"
trusted_config_paths = ["~/Development/work", "~/Development/projects", "~/Development/yoshintame", "~/.paseo/worktrees"]

[tasks."cc:model-reset"]
description = "Вернуть дефолтную модель Claude Code на claude-opus-5-5[1m] (откат перезаписи нативным пикером расширения)"
run = '''
set -e
f="$HOME/.dotfiles/modules/home/claude/config/settings.json"
tmp="$(mktemp)"
jq '.model = "claude-opus-5-5[1m]"' "$f" > "$tmp"
cat "$tmp" > "$f"
rm -f "$tmp"
echo "cc:model-reset: model = $(jq -r .model "$f")"
'''
