# yaml-language-server: $schema=https://creativeprojects.github.io/resticprofile/jsonschema/config.json

version: "2"

global:
  default-command: snapshots
  scheduler: crond
  restic-binary: /opt/homebrew/bin/restic

groups:
  all:
    profiles:
      - dev
      - home
  maintenance:
    profiles:
      - local-ops
      - b2-ops
      - gdrive-ops
  check:
    profiles:
      - local-ops
      - b2-ops
      - gdrive-ops

mixins:
  remote-copy:
    default-vars:
      TARGET: ""
      HC_UUID: ""
      REPOSITORY: ""
    copy:
      initialize: true
      initialize-copy-chunker-params: true
      repository: "$REPOSITORY"
      password-file: "{{ .Env.HOME }}/.config/resticprofile/repo.key"
      schedule: "0,3,6,9,12,15,18,21:00"
      schedule-permission: user
      schedule-log: "{{ .Env.HOME }}/.local/share/resticprofile/logs/resticprofile-local-to-$TARGET.log"
      run-after:
        - "curl -fsS -m 10 --retry 5 https://hc-ping.com/$HC_UUID"
      run-after-fail:
        - "curl -fsS -m 10 --retry 5 https://hc-ping.com/$HC_UUID/fail"

  remote-ops:
    default-vars:
      TARGET: ""
      HC_UUID: ""
      FORGET_SCHEDULE: ""
      CHECK_SCHEDULE: ""
    forget:
      group-by: "host,tags"
      keep-daily: 30
      keep-weekly: 12
      keep-monthly: 12
      keep-yearly: 3
      prune: true
      host: true
      tag: true
      schedule: "$FORGET_SCHEDULE"
      schedule-permission: user
      schedule-log: "{{ .Env.HOME }}/.local/share/resticprofile/logs/resticprofile-$TARGET-ops-forget.log"
      run-after:
        - "curl -fsS -m 10 --retry 5 https://hc-ping.com/$HC_UUID"
      run-after-fail:
        - "curl -fsS -m 10 --retry 5 https://hc-ping.com/$HC_UUID/fail"
    check:
      read-data-subset: "5%"
      schedule: "$CHECK_SCHEDULE"
      schedule-permission: user
      schedule-log: "{{ .Env.HOME }}/.local/share/resticprofile/logs/resticprofile-$TARGET-ops-check.log"
      run-after:
        - "curl -fsS -m 10 --retry 5 https://hc-ping.com/$HC_UUID"
      run-after-fail:
        - "curl -fsS -m 10 --retry 5 https://hc-ping.com/$HC_UUID/fail"

profiles:
  default:
    inherit: local

  base:
    initialize: true
    password-file: "{{ .Env.HOME }}/.config/resticprofile/repo.key"
    backup:
      exclude:
        - "**/node_modules"
        - "**/.venv"
        - "**/.DS_Store"
        - "**/Backups/restic/**"
        - "**/.config/resticprofile/*.key"
        - "**/.cursor/extensions"
        - "**/.claude/cache"
        - "**/.claude/debug"
        - "**/Documents/huggingface"
        - "**/Library/Application Support/CleanShot/media"
        - "**/Cache"
        - "**/Code Cache"
        - "**/GPUCache"
        - "**/DawnGraphiteCache"
        - "**/DawnWebGPUCache"
        - "**/DawnCache"
        - "**/Service Worker/CacheStorage"
        - "**/Shared Dictionary"
        - "**/blob_storage"
      exclude-caches: true
      one-file-system: false
      no-error-on-warning: true

  local:
    inherit: base
    repository: "local:{{ .Env.HOME }}/Backups/restic/main"
    lock: "/tmp/resticprofile-local.lock"
    run-before:
      - "mkdir -p {{ .Env.HOME }}/Backups/restic"

  b2:
    inherit: base
    env-file: "{{ .Env.HOME }}/.config/resticprofile/b2.env"
    repository: "b2:yoshintame:restic/main"
    lock: "/tmp/resticprofile-b2.lock"

  # rclone и его `[gdrive]` remote управляются декларативно через
  # home-manager (programs.rclone в modules/rclone). OAuth-токен лежит
  # в SOPS (modules/rclone/secrets.yaml). На новой машине после
  # darwin-rebuild rclone сразу работает — без интерактивного `rclone config`.
  # `rclone.program`: cron-окружение macOS не имеет нужных путей в PATH,
  # restic не находит rclone — указываем явный nix-путь.
  gdrive:
    inherit: base
    repository: "rclone:gdrive:backups/restic/main"
    lock: "/tmp/resticprofile-gdrive.lock"
    option:
      - "rclone.program=/etc/profiles/per-user/yoshintame/bin/rclone"

  quicksave:
    inherit: local
    lock: "/tmp/resticprofile-quicksave.lock"
    backup:
      source:
        - "{{ .Env.RP_SAVE_DIR }}"
      tag:
        - quicksave

  dev:
    inherit: local
    lock: "/tmp/resticprofile-dev.lock"
    backup:
      source-base: "{{ .Env.HOME }}/Development"
      source:
        - "."
      tag:
        - "{{ .Profile.Name }}"
      schedule: "*:15,45"
      schedule-permission: user
      schedule-log: "{{ .Env.HOME }}/.local/share/resticprofile/logs/resticprofile-dev.log"
      run-after:
        - "curl -fsS -m 10 --retry 5 https://hc-ping.com/${HC_DEVELOPMENT_BACKUP_UUID}"
      run-after-fail:
        - "curl -fsS -m 10 --retry 5 https://hc-ping.com/${HC_DEVELOPMENT_BACKUP_UUID}/fail"

  home:
    inherit: local
    lock: "/tmp/resticprofile-home.lock"
    backup:
      run-before:
        - "/usr/bin/env PATH=/opt/homebrew/bin:/usr/bin:/bin HOMEBREW_NO_AUTO_UPDATE=1 {{ .Env.HOME }}/.local/share/mise/shims/bun run {{ .Env.HOME }}/.dotfiles/packages/dump-packages/src/cli.ts"
        - "/bin/sh {{ .Env.HOME }}/.dotfiles/modules/resticprofile/config/dump-brewfile.sh {{ .Env.HOME }}/.dotfiles/hosts/lasthaze-mbp/packages/Brewfile"
      source-base: "{{ .Env.HOME }}"
      source:
        - ".ssh"
        - ".config"
        - ".dotfiles"
        - ".local/share/worktrees"
        - ".claude"
        - ".claude.json"
        - ".codex"
        - ".gemini"
        - ".cursor"
        - ".huggingface"
        - ".mcp-auth"
        - ".docker"
        - ".npmrc"
        - "Documents"
        - "Pictures"
        - "Video"
        - "remnote"
        - "Backups"
        - ".gnupg"
        - ".zsh_history"
        - ".bash_history"
        - ".history.db"
        - ".local/share/fish/fish_history"
        - ".yep-anywhere"
        - ".quokka"
        - ".wallaby"
        - ".console-ninja"
        - ".warp"
        - ".lazyssh"
        - ".viminfo"
        - ".lesshst"
        - ".ansible"
        - ".zshrc.bkp"
        - ".zshenv.bkp"
        - ".profile.bkp"
        - "Library/Application Support/Cursor/User"
        - "Library/Application Support/Code/User"
        - "Library/Application Support/app.cotypist.Cotypist/cotypist.db"
        - "Library/Application Support/app.cotypist.Cotypist/cotypist.db-shm"
        - "Library/Application Support/app.cotypist.Cotypist/cotypist.db-wal"
        - "Library/Application Support/app.cotypist.Cotypist/Models/adapters"
        - "Library/Application Support/app.cotypist.Cotypist/completionStats.json"
        - "Library/Keychains/login.keychain-db"
      tag:
        - home
      schedule: "1,7,13,19:00"
      schedule-permission: user
      schedule-log: "{{ .Env.HOME }}/.local/share/resticprofile/logs/resticprofile-home.log"
      run-after:
        - "curl -fsS -m 10 --retry 5 https://hc-ping.com/${HC_HOME_BACKUP_UUID}"
      run-after-fail:
        - "curl -fsS -m 10 --retry 5 https://hc-ping.com/${HC_HOME_BACKUP_UUID}/fail"

  local-to-b2:
    inherit: local
    lock: "/tmp/resticprofile-local-to-b2.lock"
    env-file: "{{ .Env.HOME }}/.config/resticprofile/b2.env"
    use:
      - name: remote-copy
        TARGET: b2
        HC_UUID: "${HC_COPY_TO_B2_UUID}"
        REPOSITORY: "b2:yoshintame:restic/main"

  local-to-gdrive:
    inherit: local
    lock: "/tmp/resticprofile-local-to-gdrive.lock"
    use:
      - name: remote-copy
        TARGET: gdrive
        HC_UUID: "${HC_COPY_TO_GDRIVE_UUID}"
        REPOSITORY: "rclone:gdrive:backups/restic/main"
    copy:
      option:
        - "rclone.program=/etc/profiles/per-user/yoshintame/bin/rclone"

  local-ops:
    inherit: local
    forget:
      group-by: "host,tags"
      keep-within: 1d
      keep-daily: 14
      keep-weekly: 8
      keep-monthly: 6
      prune: true
      host: true
      tag: true
      schedule: "sun 4:00"
      schedule-permission: user
      schedule-log: "{{ .Env.HOME }}/.local/share/resticprofile/logs/resticprofile-local-ops-forget.log"
      run-after:
        - "curl -fsS -m 10 --retry 5 https://hc-ping.com/${HC_MAINT_LOCAL_UUID}"
      run-after-fail:
        - "curl -fsS -m 10 --retry 5 https://hc-ping.com/${HC_MAINT_LOCAL_UUID}/fail"
    check:
      schedule: "*-*-01 6:00"
      schedule-permission: user
      schedule-log: "{{ .Env.HOME }}/.local/share/resticprofile/logs/resticprofile-local-ops-check.log"
      run-after:
        - "curl -fsS -m 10 --retry 5 https://hc-ping.com/${HC_MAINT_LOCAL_UUID}"
      run-after-fail:
        - "curl -fsS -m 10 --retry 5 https://hc-ping.com/${HC_MAINT_LOCAL_UUID}/fail"

  b2-ops:
    inherit: b2
    use:
      - name: remote-ops
        TARGET: b2
        HC_UUID: "${HC_MAINT_B2_UUID}"
        FORGET_SCHEDULE: "sun 5:00"
        CHECK_SCHEDULE: "*-*-01 7:00"

  gdrive-ops:
    inherit: gdrive
    use:
      - name: remote-ops
        TARGET: gdrive
        HC_UUID: "${HC_MAINT_GDRIVE_UUID}"
        FORGET_SCHEDULE: "sun 6:00"
        CHECK_SCHEDULE: "*-*-01 8:00"
