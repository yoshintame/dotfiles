name: nix-windows

on:
  push:
    paths:
      - flake.nix
      - flake.lock
      - hosts/lasthaze-gaming/**
      - lib/nix-windows/**
      - modules/nixos/wsl/**
      - modules/windows/**
      - .github/workflows/nix-windows.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tarball:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@v31

      - name: Build the lasthaze-gaming tarball
        run: |
          nix build .#nixosConfigurations.lasthaze-gaming.config.system.build.tarballBuilder
          sudo ./result/bin/nixos-wsl-tarball-builder lasthaze-gaming.wsl

      - uses: actions/upload-artifact@v4
        with:
          name: lasthaze-gaming-wsl
          path: lasthaze-gaming.wsl
          retention-days: 3

  windows:
    needs: tarball
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: lasthaze-gaming-wsl

      - name: Install the distribution
        run: |
          wsl --update
          wsl --install --from-file lasthaze-gaming.wsl --name NixOS --no-launch
          wsl -d NixOS -e true
          $repo = '/mnt/' + $PWD.Drive.Name.ToLower() + ($PWD.Path.Substring(2) -replace '\\', '/')
          "REPO=$repo" >> $env:GITHUB_ENV

      - name: Create the managed users' hives
        run: |
          $users = wsl -d NixOS -e /run/current-system/sw/bin/nix eval --json "$env:REPO#nixosConfigurations.lasthaze-gaming.config.windows.users" --apply builtins.attrNames | ConvertFrom-Json
          foreach ($user in $users) {
            New-LocalUser -Name $user -NoPassword | Out-Null
            New-Item -ItemType Directory -Force "C:\Users\$user" | Out-Null
            Copy-Item -Force C:\Users\Default\NTUSER.DAT "C:\Users\$user\NTUSER.DAT"
          }

      - name: windows-rebuild switch
        run: wsl -d NixOS -e /run/current-system/sw/bin/windows-rebuild switch --flake "$env:REPO#lasthaze-gaming"

      - name: windows-rebuild check
        run: wsl -d NixOS -e /run/current-system/sw/bin/windows-rebuild check --flake "$env:REPO#lasthaze-gaming"

      - name: windows-rebuild switch again
        run: wsl -d NixOS -e /run/current-system/sw/bin/windows-rebuild switch --flake "$env:REPO#lasthaze-gaming"
