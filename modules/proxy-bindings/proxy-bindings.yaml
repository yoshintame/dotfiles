outputs:
  lua: ../hammerspoon/config/generated/proxy-bindings.lua
  typescript: ../karabiner/config/src/generated/proxy-bindings.ts

bindings:
  # Text processing (RewriteBar)
  fix: cmd alt ctrl shift r

  # 1Password
  passwords: cmd alt ctrl shift p

  # Color picker (Sip)
  colorPicker: cmd alt ctrl shift c

  # Roulette (PixelSnap)
  roulette: cmd alt ctrl shift x
  rouletteClear: cmd alt ctrl shift z

  # Raycast
  spotlight: cmd alt ctrl shift f

  # Claude Desktop
  claudeSpotlight: cmd alt ctrl shift s

  # Ice (menu bar manager)
  iceMenuItemPicker: cmd alt ctrl shift m

  # Leader (in-app whichkey/leader trigger, fired by Karabiner from bare ⏎)
  leaderInApp: cmd alt ctrl shift l

  # Screenshots (CleanShot)
  screenshotArea: cmd alt ctrl shift 1
  screenshotFull: cmd alt ctrl shift 2
  screenshotWindow: cmd alt ctrl shift 3
  screenshotOcr: cmd alt ctrl shift 4
  screenshotVideo: cmd alt ctrl shift 5
  screenshotScroll: cmd alt ctrl shift 6
  screenshotHistory: cmd alt ctrl shift 7

  # AltTab — fired by BTT trackpad gestures (modules/btt-gestures)
  altTabApps: cmd alt ctrl shift a
  altTabWindows: cmd alt ctrl shift w

  # VoiceInk — Power Mode push-to-talk hotkey, fired by 4F click hold
  voiceInkToggle: cmd alt ctrl shift v

  # Clipboard history direct-paste — caught by Hammerspoon clipboard-history ring,
  # fired by Karabiner Hyper+Cmd+1..5 (paste Nth-from-last item)
  pasteHistory1: cmd alt ctrl shift f13
  pasteHistory2: cmd alt ctrl shift f14
  pasteHistory3: cmd alt ctrl shift f15
  pasteHistory4: cmd alt ctrl shift f16
  pasteHistory5: cmd alt ctrl shift f17
