# 1Password SSH agent — key filter and offer order.
# Keys are offered to servers top-to-bottom; this keeps the key a server
# actually wants within its MaxAuthTries window.

# 1 — primary key (current main, ed25519): auth only (commit signing moved to Secure Enclave, see git-ssh-sign)
[[ssh-keys]]
item = "yoshintame-mbp"

# 2 — previous main key (rsa); kept until server authorized_keys are audited
[[ssh-keys]]
item = "lasthaze-mbp"

# tail — rarely used
[[ssh-keys]]
item = "GitLab"

[[ssh-keys]]
item = "Yoshintame PC"
