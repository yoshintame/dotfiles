name: checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702

      - name: Formatting (treefmt)
        run: nix build --no-link .#checks.x86_64-linux.treefmt

      - name: Evaluate the lasthaze-mbp system
        run: nix eval --impure --raw --option allow-import-from-derivation false .#darwinConfigurations.lasthaze-mbp.system.drvPath

      - name: Shellcheck the bootstrap scripts
        run: nix run --inputs-from . nixpkgs#shellcheck -- --severity=warning bootstrap.sh tests/tart/*.sh
