# shellcheck shell=bash
# shellcheck disable=SC2034

KSW_CONFIG_DIR="$(dirname "$DESVIO_CONFIG_FILE")"
KSW_STATE="$HOME/.local/state/keyswitcher-update"

DESVIO_REPO="$HOME/Development/graninilya/keyswitcher"
DESVIO_BRANCH="desvio"
DESVIO_NAME="keyswitcher"
DESVIO_BASE="$(cat "$KSW_STATE/audited-tag" 2>/dev/null || true)"
DESVIO_WORKTREE="$HOME/.local/share/desvio/keyswitcher/build-tree"
DESVIO_STATE="$HOME/.local/share/desvio/keyswitcher/state"
DESVIO_AUTO_RESOLVE=0
DESVIO_BISECT_GATE=0

desvio_preflight() {
  DESVIO_REPO="$DESVIO_REPO" DESVIO_MANIFEST="$DESVIO_MANIFEST" KSW_STATE="$KSW_STATE" \
    "$KSW_CONFIG_DIR/gates/preflight.sh" "${base_ref:-$DESVIO_BASE}"
}

desvio_build() {
  in_tree App/build.sh release
}

desvio_verify() {
  DESVIO_WORKTREE="$DESVIO_WORKTREE" DESVIO_STATE="$DESVIO_STATE" DESVIO_BASE="$DESVIO_BASE" KSW_STATE="$KSW_STATE" \
    "$KSW_CONFIG_DIR/gates/verify.sh"
}
