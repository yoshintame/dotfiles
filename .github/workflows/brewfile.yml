name: brewfile

on:
  push:
    branches: [master]
    paths:
      - hosts/lasthaze-mbp/packages/Brewfile*
      - packages/brewfile-lint/**
      - .github/workflows/brewfile.yml
  schedule:
    - cron: "0 19 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brewfile
  cancel-in-progress: true

jobs:
  lint:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install --frozen-lockfile

      - name: Check Brewfile entries a clean Mac would install
        run: bun run packages/brewfile-lint/src/cli.ts --trust-taps
