# yaml-language-server: $schema=https://mise.jdx.dev/schema/mise-task.json
# Dotfiles management tasks
# Usage: dot <command> [args]

["dot:edit"]
description = "Open dotfiles in editor"
dir = "{{env.DOTFILES}}"
run = '${EDITOR:-code} .'

["dot:rebuild"]
description = "Rebuild nix-darwin configuration"
dir = "{{env.DOTFILES}}"
depends = ["dot:proxy-bindings"]
# --impure: sopsTemplates gates sops.templates wiring on `builtins.pathExists`
# of the age key, which only works under --impure. Without it the gate stays
# false, sops.templates aren't activated, and rendered secret files (profiles.yaml,
# b2.env, hc.env, repo.key) silently disappear from new sops-nix generations.
run = '''
git add -A
sudo env NIX_PATH="nixpkgs=flake:nixpkgs" darwin-rebuild switch --impure --flake .#lasthaze-mbp
'''

["dot:rebuild-full"]
description = "Rebuild AND converge Homebrew to the Brewfile (install missing + uninstall extras)"
dir = "{{env.DOTFILES}}"
depends = ["dot:proxy-bindings"]
run = '''
git add -A
sudo env DOT_BREW_FULL=1 NIX_PATH="nixpkgs=flake:nixpkgs" darwin-rebuild switch --impure --flake .#lasthaze-mbp
'''

["dot:link"]
description = "Materialize home-manager links without a full switch (no sudo, $HOME only)"
dir = "{{env.DOTFILES}}"
run = '''
export NIX_PATH="nixpkgs=flake:nixpkgs"
out="$(mktemp -d)/result"
nix build --impure --out-link "$out" \
  '.#darwinConfigurations.lasthaze-mbp.config.home-manager.users.yoshintame.home.activationPackage'
"$out/activate"
'''

["dot:apm"]
description = "Run APM in global scope, persist its lock, and restore nix links"
dir = "~/.apm"
raw = true
usage = 'arg "<args>" var=#true double_dash="automatic"'
run = '''
set -euo pipefail

eval "apm $usage_args"
cp "$HOME/.apm/apm.lock.yaml" "{{env.DOTFILES}}/modules/home/apm/config/apm.lock.yaml"
rm "$HOME/.apm/apm.lock.yaml"
mise run dot:link
'''

["dot:proxy-bindings"]
description = "Generate proxy-binding files from YAML config"
dir = "~/.dotfiles/modules/proxy-bindings"
raw = true
run = 'bun run ~/.dotfiles/packages/proxy-bindings/src/cli.ts generate "$@"'

["dot:btt-gestures"]
description = "Sync trackpad gestures from YAML to BetterTouchTool via REST API"
dir = "~/.dotfiles/modules/home/btt-gestures"
raw = true
run = 'bun run ~/.dotfiles/packages/btt-gestures/src/cli.ts "$@"'

["dot:dump-packages"]
description = "Dump unmanaged apps and Setapp list for backup"
run = 'bun run "$HOME/.dotfiles/packages/dump-packages/src/cli.ts"'

["dot:bootstrap-age-key"]
description = "Restore sops age key from 1Password (run once on new machine)"
run = '''
KEY_DIR="$HOME/.config/sops/age"
KEY_FILE="$KEY_DIR/keys.txt"
if [ -f "$KEY_FILE" ]; then
    echo "Age key already exists at $KEY_FILE, skipping."
else
    mkdir -p "$KEY_DIR"
    /opt/homebrew/bin/op read 'op://Private/sops-age-key/private key' > "$KEY_FILE"
    chmod 600 "$KEY_FILE"
    echo "Age key restored to $KEY_FILE"
fi
'''

["dot:sops-bootstrap"]
description = "Force-reload sops-nix LaunchAgent on darwin (workaround for Mic92/sops-nix#910 initial bootstrap I/O error)"
run = '''
set -euo pipefail

if [ "$(uname -s)" != "Darwin" ]; then
    echo "dot:sops-bootstrap is darwin-only — skipping on $(uname -s)"
    exit 0
fi

PLIST="$HOME/Library/LaunchAgents/org.nix-community.home.sops-nix.plist"
LABEL="org.nix-community.home.sops-nix"

if [ ! -f "$PLIST" ]; then
    echo "!! sops-nix plist not found at $PLIST"
    echo "   Run a darwin-rebuild switch first so home-manager installs it via setupLaunchAgents."
    exit 1
fi

# Bootout silently if loaded (returns 3 if not loaded — that is fine and expected on first install).
launchctl bootout "gui/$UID/$LABEL" 2>/dev/null || true

# Bootstrap with explicit plist path. First call after a fresh switch sometimes fails with
# `Bootstrap failed: 5: Input/output error` due to sops-nix#910 — the bootout above clears
# the half-loaded state so this call succeeds.
launchctl bootstrap "gui/$UID" "$PLIST"

# RunAtLoad fires automatically on bootstrap but kickstart is a defensive nudge in case
# launchd debounced it (e.g. when plist hash matched a previously-loaded version).
launchctl kickstart -k "gui/$UID/$LABEL"

echo "sops-nix LaunchAgent reloaded; decrypted secrets should be available under ~/.config/sops-nix/secrets/."
'''

["dot:bootstrap-ssh"]
description = "Wire ~/.ssh/config to 1Password SSH Agent (run once on new machine)"
run = '''
set -euo pipefail

AGENT_SOCK="$HOME/Library/Group Containers/2BUA8C4S2C.com.1password/t/agent.sock"
SSH_DIR="$HOME/.ssh"
SSH_CONFIG="$SSH_DIR/config"
MARKER="# managed-by: dot:bootstrap-ssh"

if [ ! -S "$AGENT_SOCK" ]; then
    echo "!! 1Password SSH Agent socket not found at:"
    echo "   $AGENT_SOCK"
    echo
    echo "Open 1Password.app → Settings → Developer → enable 'Use the SSH agent',"
    echo "then re-run: mise run dot:bootstrap-ssh"
    exit 1
fi

mkdir -p "$SSH_DIR"
chmod 700 "$SSH_DIR"

if [ -f "$SSH_CONFIG" ] && grep -qF "$MARKER" "$SSH_CONFIG"; then
    echo "~/.ssh/config already wired to 1Password SSH Agent, skipping."
else
    touch "$SSH_CONFIG"
    chmod 600 "$SSH_CONFIG"
    {
        echo ""
        echo "$MARKER"
        echo "Host *"
        echo "  IdentityAgent \"$AGENT_SOCK\""
    } >> "$SSH_CONFIG"
    echo "Appended 1Password SSH Agent IdentityAgent block to $SSH_CONFIG"
fi

echo
echo "Keys visible via 1Password SSH Agent:"
SSH_AUTH_SOCK="$AGENT_SOCK" ssh-add -l || {
    echo "!! ssh-add -l failed. Make sure 1Password is unlocked and at least one SSH key item exists."
    exit 1
}
'''

["dot:bootstrap-onedrive"]
description = "Authorize the OneDrive rclone remote in a browser (run once on new machine)"
run = 'python3 "$HOME/.dotfiles/modules/home/rclone/onedrive-authorize.py"'
