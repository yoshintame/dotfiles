# yaml-language-server: $schema=https://creativeprojects.github.io/resticprofile/jsonschema/config.json

version: "2"

global:
  default-command: snapshots
  restic-binary: /opt/homebrew/bin/restic
  schedule-defaults:
    permission: user_logged_on
    priority: background

groups:
  all:
    profiles:
      - dev
      - home
      - vault
  maintenance:
    profiles:
      - local-ops
  check:
    profiles:
      - local-ops
      - b2-ops
      - gdrive-ops
      - onedrive-ops

mixins:
  remote-copy:
    default-vars:
      TARGET: ""
      REPOSITORY: ""
    copy:
      initialize: true
      initialize-copy-chunker-params: true
      repository: "$REPOSITORY"
      password-file: "{{ .Env.HOME }}/.config/resticprofile/repo.key"
      schedule-log: "{{ .Env.HOME }}/.local/share/resticprofile/logs/resticprofile-local-to-$TARGET.log"

  remote-ops:
    default-vars:
      TARGET: ""
    check:
      read-data-subset: "5%"
      schedule-log: "{{ .Env.HOME }}/.local/share/resticprofile/logs/resticprofile-$TARGET-ops-check.log"

profiles:
  default:
    inherit: local

  base:
    initialize: true
    force-inactive-lock: true
    password-file: "{{ .Env.HOME }}/.config/resticprofile/repo.key"
    {{- if .Env.RESTICPROFILE_SCHEDULE_ID }}
    env:
      GOMAXPROCS: "2"
    {{- end }}
    backup:
      send-after: &gatus-after
        - method: POST
          url: "@gatusBackupEndpoint@-$PROFILE_NAME-$PROFILE_COMMAND/external?success=true"
          headers: &gatus-auth
            - name: Authorization
              value: "Bearer ${GATUS_BACKUP_TOKEN}"
      send-after-fail: &gatus-fail
        - method: POST
          url: "@gatusBackupEndpoint@-$PROFILE_NAME-$PROFILE_COMMAND/external?success=false&error=$ERROR"
          headers: *gatus-auth
      group-by: "host,tags"
      exclude:
        - "**/node_modules"
        - "**/.venv"
        - "**/.DS_Store"
        - "**/Backups/restic/**"
        - "**/.config/resticprofile/*.key"
        - "**/.cursor/extensions"
        - "**/.claude/cache"
        - "**/.claude/debug"
        - "**/.claude/cc.duckdb*"
        - "**/Documents/huggingface"
        - "**/Library/Application Support/CleanShot/media"
        - "**/Cache"
        - "**/Code Cache"
        - "**/GPUCache"
        - "**/DawnGraphiteCache"
        - "**/DawnWebGPUCache"
        - "**/DawnCache"
        - "**/Service Worker/CacheStorage"
        - "**/Shared Dictionary"
        - "**/blob_storage"
      exclude-caches: true
      one-file-system: false
      no-error-on-warning: true
    copy:
      send-after: *gatus-after
      send-after-fail: *gatus-fail
    check:
      send-after: *gatus-after
      send-after-fail: *gatus-fail
    forget:
      send-after: *gatus-after
      send-after-fail: *gatus-fail

  local:
    inherit: base
    repository: "local:{{ .Env.HOME }}/Backups/restic/main"
    lock: "/tmp/resticprofile-local.lock"
    run-before:
      - "mkdir -p {{ .Env.HOME }}/Backups/restic"

  b2:
    inherit: base
    env-file: "{{ .Env.HOME }}/.config/resticprofile/b2.env"
    repository: "s3:s3.eu-central-003.backblazeb2.com/yoshintame/restic/main"
    lock: "/tmp/resticprofile-b2.lock"

  # rclone и его `[gdrive]` remote управляются декларативно через
  # home-manager (programs.rclone в modules/rclone). OAuth-токен лежит
  # в SOPS (modules/rclone/secrets.yaml). На новой машине после
  # darwin-rebuild rclone сразу работает — без интерактивного `rclone config`.
  # `rclone.program`: PATH планового задания — снимок на момент
  # `rp schedule up`, restic может не найти rclone — указываем явный nix-путь.
  gdrive:
    inherit: base
    repository: "rclone:gdrive:backups/restic/main"
    lock: "/tmp/resticprofile-gdrive.lock"
    option:
      - "rclone.program=/etc/profiles/per-user/yoshintame/bin/rclone"

  # OneDrive намеренно отсутствует в programs.rclone: Microsoft ротирует
  # refresh_token при каждом использовании, а home-manager перезаписывает
  # rclone.conf целиком на каждой активации. Токен поэтому живёт в отдельном
  # конфиге, которым владеет только rclone, и путь к нему указывается явно.
  # Обоснование — decision `onedrive-token-outside-nix` в Obsidian vault.
  onedrive:
    inherit: base
    repository: "rclone:onedrive:backups/restic/main"
    lock: "/tmp/resticprofile-onedrive.lock"
    option:
      - "rclone.program=/etc/profiles/per-user/yoshintame/bin/rclone --config {{ .Env.HOME }}/.config/rclone/onedrive.conf"

  quicksave:
    inherit: local
    lock: "/tmp/resticprofile-quicksave.lock"
    backup:
      source:
        - "{{ .Env.RP_SAVE_DIR }}"
      tag:
        - quicksave
      send-after: []
      send-after-fail: []

  dev:
    inherit: local
    lock: "/tmp/resticprofile-dev.lock"
    backup:
      source-base: "{{ .Env.HOME }}/Development"
      source:
        - "."
      tag:
        - "{{ .Profile.Name }}"
      schedule: "*:15,45"
      schedule-log: "{{ .Env.HOME }}/.local/share/resticprofile/logs/resticprofile-dev.log"
      send-after...:
        - url: "https://hc-ping.com/${HC_DEVELOPMENT_BACKUP_UUID}"
      send-after-fail...:
        - url: "https://hc-ping.com/${HC_DEVELOPMENT_BACKUP_UUID}/fail"

  home:
    inherit: local
    lock: "/tmp/resticprofile-home.lock"
    backup:
      run-before:
        - "/usr/bin/env PATH=/opt/homebrew/bin:/usr/bin:/bin HOMEBREW_NO_AUTO_UPDATE=1 {{ .Env.HOME }}/.local/share/mise/shims/bun run {{ .Env.HOME }}/.dotfiles/packages/dump-packages/src/cli.ts"
        - "/bin/sh {{ .Env.HOME }}/.dotfiles/modules/home/resticprofile/config/dump-brewfile.sh {{ .Env.HOME }}/.dotfiles/hosts/lasthaze-mbp/packages/Brewfile"
        - "/usr/bin/env PATH=/usr/bin:/bin:/usr/sbin {{ .Env.HOME }}/.local/share/mise/shims/bun {{ .Env.HOME }}/.cache/.bun/bin/app-state prepare"
      source-base: "{{ .Env.HOME }}"
      source:
        - ".ssh"
        - ".config"
        - ".dotfiles"
        - ".local/share/worktrees"
        - ".claude"
        - ".claude.json"
        - ".codex"
        - ".gemini"
        - ".cursor"
        - ".huggingface"
        - ".mcp-auth"
        - ".docker"
        - ".npmrc"
        - "Documents"
        - "Pictures"
        - "Video"
        - "remnote"
        - "Backups"
        - ".gnupg"
        - ".zsh_history"
        - ".bash_history"
        - ".history.db"
        - ".local/share/fish/fish_history"
        - ".local/share/atuin"
        - ".paseo"
        - ".yep-anywhere"
        - ".quokka"
        - ".wallaby"
        - ".console-ninja"
        - ".warp"
        - ".lazyssh"
        - ".viminfo"
        - ".lesshst"
        - ".ansible"
        - ".zshrc.bkp"
        - ".zshenv.bkp"
        - ".profile.bkp"
        - "Library/Application Support/Cursor/User"
        - "Library/Application Support/Code/User"
        - "Library/Application Support/app.cotypist.Cotypist/cotypist.db"
        - "Library/Application Support/app.cotypist.Cotypist/cotypist.db-shm"
        - "Library/Application Support/app.cotypist.Cotypist/cotypist.db-wal"
        - "Library/Application Support/app.cotypist.Cotypist/Models/adapters"
        - "Library/Application Support/app.cotypist.Cotypist/completionStats.json"
        - "Library/Application Support/zoxide"
        - "Library/Application Support/com.wiheads.paste-setapp/db.sqlite"
        - "Library/Application Support/com.wiheads.paste-setapp/db.sqlite-shm"
        - "Library/Application Support/com.wiheads.paste-setapp/db.sqlite-wal"
        - "Library/Keychains/login.keychain-db"
        - "Library/Preferences"
        - ".local/state/app-state"
      files-from-verbatim: "{{ .Env.HOME }}/.local/state/app-state/files-from.txt"
      exclude-file: "{{ .Env.HOME }}/.local/state/app-state/exclude.txt"
      exclude...:
        - "**/.paseo/models"
        - "**/.paseo/*.log"
      tag:
        - home
      schedule: "1,7,13,19:00"
      schedule-log: "{{ .Env.HOME }}/.local/share/resticprofile/logs/resticprofile-home.log"
      send-after...:
        - url: "https://hc-ping.com/${HC_HOME_BACKUP_UUID}"
      send-after-fail...:
        - url: "https://hc-ping.com/${HC_HOME_BACKUP_UUID}/fail"

  vault:
    inherit: local
    lock: "/tmp/resticprofile-vault.lock"
    backup:
      source:
        - "{{ .Env.HOME }}/Documents/obsidian/yoshintame"
      exclude...:
        - "**/.obsidian/workspace*.json"
      tag:
        - vault
      skip-if-unchanged: true
      retry-lock: 5m
      schedule: "*:00,10,20,30,40,50"
      schedule-log: "{{ .Env.HOME }}/.local/share/resticprofile/logs/resticprofile-vault.log"

  local-to-b2:
    inherit: local
    lock: "/tmp/resticprofile-local-to-b2.lock"
    env-file: "{{ .Env.HOME }}/.config/resticprofile/b2.env"
    use:
      - name: remote-copy
        TARGET: b2
        REPOSITORY: "s3:s3.eu-central-003.backblazeb2.com/yoshintame/restic/main"
    copy:
      schedule: "0,3,6,9,12,15,18,21:00"
      send-after...:
        - url: "https://hc-ping.com/${HC_COPY_TO_B2_UUID}"
      send-after-fail...:
        - url: "https://hc-ping.com/${HC_COPY_TO_B2_UUID}/fail"

  local-to-gdrive:
    inherit: local
    lock: "/tmp/resticprofile-local-to-gdrive.lock"
    use:
      - name: remote-copy
        TARGET: gdrive
        REPOSITORY: "rclone:gdrive:backups/restic/main"
    copy:
      option:
        - "rclone.program=/etc/profiles/per-user/yoshintame/bin/rclone"
      schedule: "1,4,7,10,13,16,19,22:30"
      send-after...:
        - url: "https://hc-ping.com/${HC_COPY_TO_GDRIVE_UUID}"
      send-after-fail...:
        - url: "https://hc-ping.com/${HC_COPY_TO_GDRIVE_UUID}/fail"

  # Хуки Healthchecks здесь пока не заведены: чеки onedrive в HC не созданы, а
  # сам канал оповещений сломан (см. problem `backup-failures-invisible`).
  # Пустой UUID дал бы 404 на каждый пинг, то есть шум вместо сигнала. Перевести
  # на mixin `remote-copy`/`remote-ops` вместе с починкой алертинга.
  local-to-onedrive:
    inherit: local
    lock: "/tmp/resticprofile-local-to-onedrive.lock"
    copy:
      initialize: true
      initialize-copy-chunker-params: true
      repository: "rclone:onedrive:backups/restic/main"
      password-file: "{{ .Env.HOME }}/.config/resticprofile/repo.key"
      option:
        - "rclone.program=/etc/profiles/per-user/yoshintame/bin/rclone --config {{ .Env.HOME }}/.config/rclone/onedrive.conf"
      schedule: "2,5,8,11,14,17,20,23:00"
      schedule-log: "{{ .Env.HOME }}/.local/share/resticprofile/logs/resticprofile-local-to-onedrive.log"

  onedrive-ops:
    inherit: onedrive
    check:
      read-data-subset: "5%"
      schedule: "*-*-01 9:00"
      schedule-log: "{{ .Env.HOME }}/.local/share/resticprofile/logs/resticprofile-onedrive-ops-check.log"

  local-ops:
    inherit: local
    forget:
      group-by: "host,tags"
      keep-within: 30d
      keep-daily: 30
      keep-weekly: 12
      prune: true
      host: true
      tag: true
      schedule: "Sun 05:00"
      schedule-log: "{{ .Env.HOME }}/.local/share/resticprofile/logs/resticprofile-local-ops-forget.log"
      send-after...:
        - url: "https://hc-ping.com/${HC_MAINT_LOCAL_UUID}"
      send-after-fail...:
        - url: "https://hc-ping.com/${HC_MAINT_LOCAL_UUID}/fail"
    check:
      schedule: "*-*-01 6:00"
      schedule-log: "{{ .Env.HOME }}/.local/share/resticprofile/logs/resticprofile-local-ops-check.log"
      send-after...:
        - url: "https://hc-ping.com/${HC_MAINT_LOCAL_UUID}"
      send-after-fail...:
        - url: "https://hc-ping.com/${HC_MAINT_LOCAL_UUID}/fail"

  b2-ops:
    inherit: b2
    use:
      - name: remote-ops
        TARGET: b2
    check:
      schedule: "*-*-01 7:00"
      send-after...:
        - url: "https://hc-ping.com/${HC_MAINT_B2_UUID}"
      send-after-fail...:
        - url: "https://hc-ping.com/${HC_MAINT_B2_UUID}/fail"

  gdrive-ops:
    inherit: gdrive
    check:
      read-data-subset: "5%"
      schedule: "*-*-01 10:00"
      schedule-log: "{{ .Env.HOME }}/.local/share/resticprofile/logs/resticprofile-gdrive-ops-check.log"
      send-after...:
        - url: "https://hc-ping.com/${HC_MAINT_GDRIVE_UUID}"
      send-after-fail...:
        - url: "https://hc-ping.com/${HC_MAINT_GDRIVE_UUID}/fail"
