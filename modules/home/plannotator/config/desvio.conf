# shellcheck shell=bash
# shellcheck disable=SC2034

DESVIO_REPO="$HOME/Development/backnotprop/plannotator"
DESVIO_BRANCH="desvio"
DESVIO_NAME="plannotator-vscode"
DESVIO_BASE="$(git -C "$DESVIO_REPO" tag --list 'v*' --sort=-v:refname | head -1)"
DESVIO_WORKTREE="$HOME/.local/share/desvio/plannotator/build-tree"
DESVIO_STATE="$HOME/.local/share/desvio/plannotator/state"
DESVIO_CLEAN_KEEP="-e node_modules"

desvio_install() {
  if stamp_changed deps bun.lock; then
    in_tree bun install --frozen-lockfile && stamp_write deps bun.lock
  fi
}

desvio_seed() {
  in_tree bun "$(dirname "$DESVIO_CONFIG_FILE")/vscode-theme.ts" packages/ui/utils/vscodeTheme.json
}

desvio_build() {
  local version
  version=$(in_tree bun -p 'require("./package.json").version')
  in_tree bun run build:review
  in_tree bun run build:hook
  in_tree bun build apps/hook/server/index.ts --compile --no-compile-autoload-bunfig --target=bun-darwin-arm64 \
    --define "__CLI_VERSION__=\"$version+vscode\"" --outfile "$DESVIO_STATE/plannotator"
}

desvio_verify() {
  in_tree env PATH="$DESVIO_WORKTREE/packages/ui/node_modules/.bin:$PATH" bun run typecheck
}
