worktree-path = "~/.local/share/worktrees/{{ repo }}/{{ branch | sanitize }}"

[merge]
commit = false
squash = false
rebase = false
ff = false
remove = false

[[pre-start]]
setup = "$HOME/.dotfiles/modules/worktrunk/config/hooks/pre-start.sh {{ primary_worktree_path }} {{ worktree_path }}"

[[post-start]]
install = "$HOME/.dotfiles/modules/worktrunk/config/hooks/post-start.sh {{ worktree_path }}"
