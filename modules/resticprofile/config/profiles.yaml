# yaml-language-server: $schema=https://creativeprojects.github.io/resticprofile/jsonschema/config.json

version: "2"

global:
  default-command: snapshots
  scheduler: crond
  restic-binary: /opt/homebrew/bin/restic

groups:
  all:
    profiles:
      - dev
      - home
  maintenance:
    profiles:
      - local-ops
      - b2-ops
      - gdrive-ops
  check:
    profiles:
      - local-ops
      - b2-ops
      - gdrive-ops

# Reusable parameterized blocks for offsite remotes (B2, Google Drive).
# Variables (`$NAME`) are resolved by resticprofile mixin engine when a
# profile invokes the mixin via `use:`. `${HC_*_UUID}` placeholders inside
# the `use:` block go through SOPS envsubst earlier and are replaced with
# real UUIDs at render time (see modules/resticprofile/default.nix).
mixins:
  remote-copy:
    default-vars:
      TARGET: ""
      HC_UUID: ""
      REPOSITORY: ""
    copy:
      initialize: true
      initialize-copy-chunker-params: true
      repository: "$REPOSITORY"
      password-file: "{{ .Env.HOME }}/.config/resticprofile/repo.key"
      schedule: "0,3,6,9,12,15,18,21:00"
      schedule-permission: user
      schedule-log: "{{ .Env.HOME }}/.local/share/resticprofile/logs/resticprofile-local-to-$TARGET.log"
      run-after:
        - "curl -fsS -m 10 --retry 5 https://hc-ping.com/$HC_UUID"
      run-after-fail:
        - "curl -fsS -m 10 --retry 5 https://hc-ping.com/$HC_UUID/fail"

  remote-ops:
    default-vars:
      TARGET: ""
      HC_UUID: ""
      FORGET_SCHEDULE: ""
      CHECK_SCHEDULE: ""
    forget:
      group-by: "host,tags"
      keep-daily: 30
      keep-weekly: 12
      keep-monthly: 12
      keep-yearly: 3
      prune: true
      host: true
      tag: true
      schedule: "$FORGET_SCHEDULE"
      schedule-permission: user
      schedule-log: "{{ .Env.HOME }}/.local/share/resticprofile/logs/resticprofile-$TARGET-ops-forget.log"
      run-after:
        - "curl -fsS -m 10 --retry 5 https://hc-ping.com/$HC_UUID"
      run-after-fail:
        - "curl -fsS -m 10 --retry 5 https://hc-ping.com/$HC_UUID/fail"
    check:
      read-data-subset: "5%"
      schedule: "$CHECK_SCHEDULE"
      schedule-permission: user
      schedule-log: "{{ .Env.HOME }}/.local/share/resticprofile/logs/resticprofile-$TARGET-ops-check.log"
      run-after:
        - "curl -fsS -m 10 --retry 5 https://hc-ping.com/$HC_UUID"
      run-after-fail:
        - "curl -fsS -m 10 --retry 5 https://hc-ping.com/$HC_UUID/fail"

profiles:
  default:
    inherit: local

  base:
    initialize: true
    password-file: "{{ .Env.HOME }}/.config/resticprofile/repo.key"
    backup:
      exclude:
        - "**/node_modules"
        - "**/.venv"
        - "**/.DS_Store"
        - "**/Backups/restic/**"
        - "**/.config/resticprofile/*.key"
        - "**/.cursor/extensions"
        - "**/.claude/cache"
        - "**/.claude/debug"
        - "**/Documents/huggingface"
        - "**/Library/Application Support/CleanShot/media"
        - "**/Cache"
        - "**/Code Cache"
        - "**/GPUCache"
        - "**/DawnGraphiteCache"
        - "**/DawnWebGPUCache"
        - "**/DawnCache"
        - "**/Service Worker/CacheStorage"
        - "**/Shared Dictionary"
        - "**/blob_storage"
      exclude-caches: true
      one-file-system: false
      no-error-on-warning: true

  # --- Local repository (hub for all backups) ---
  local:
    inherit: base
    repository: "local:{{ .Env.HOME }}/Backups/restic/main"
    lock: "/tmp/resticprofile-local.lock"
    run-before:
      - "mkdir -p {{ .Env.HOME }}/Backups/restic"

  # --- B2 repository (offsite copy); needs B2_ACCOUNT_ID, B2_ACCOUNT_KEY ---
  b2:
    inherit: base
    env-file: "{{ .Env.HOME }}/.config/resticprofile/b2.env"
    repository: "b2:yoshintame:restic/main"
    lock: "/tmp/resticprofile-b2.lock"

  # --- Google Drive repository (offsite copy via rclone) ---
  # Requires rclone remote `gdrive` configured via `rclone config`
  # (~/.config/rclone/rclone.conf). Path is relative to My Drive root.
  # `rclone.program`: cron-окружение macOS не имеет /opt/homebrew/bin в PATH,
  # restic не находит rclone — указываем явный путь.
  gdrive:
    inherit: base
    repository: "rclone:gdrive:backups/restic/main"
    lock: "/tmp/resticprofile-gdrive.lock"
    option:
      - "rclone.program=/opt/homebrew/bin/rclone"

  quicksave:
    inherit: local
    backup:
      source:
        - "{{ .Env.RP_SAVE_DIR }}"
      tag:
        - quicksave

  dev:
    inherit: local
    backup:
      source-base: "{{ .Env.HOME }}/Development"
      source:
        - "."
      tag:
        - "{{ .Profile.Name }}"
      schedule: "*:00,30"
      schedule-permission: user
      schedule-log: "{{ .Env.HOME }}/.local/share/resticprofile/logs/resticprofile-dev.log"
      run-after:
        - "curl -fsS -m 10 --retry 5 https://hc-ping.com/b771448c-05dc-4f14-8513-87583331f61b"
      run-after-fail:
        - "curl -fsS -m 10 --retry 5 https://hc-ping.com/b771448c-05dc-4f14-8513-87583331f61b/fail"

  home:
    inherit: local
    backup:
      run-before:
        - "/usr/bin/env PATH=/opt/homebrew/bin:/usr/bin:/bin HOMEBREW_NO_AUTO_UPDATE=1 {{ .Env.HOME }}/.local/share/mise/shims/bun run {{ .Env.HOME }}/.dotfiles/packages/dump-packages/src/cli.ts"
        - "/bin/sh {{ .Env.HOME }}/.dotfiles/modules/resticprofile/config/dump-brewfile.sh {{ .Env.HOME }}/.dotfiles/hosts/lasthaze-mbp/packages/Brewfile"
      source-base: "{{ .Env.HOME }}"
      source:
        - ".ssh"
        - ".config"
        - ".dotfiles"
        - ".local/share/worktrees"
        - ".claude"
        - ".claude.json"
        - ".codex"
        - ".gemini"
        - ".cursor"
        - ".huggingface"
        - ".mcp-auth"
        - ".docker"
        - ".npmrc"
        - "Documents"
        - "Pictures"
        - "remnote"
        - "Backups"
        - ".gnupg"
        - ".zsh_history"
        - ".bash_history"
        - ".history.db"
        - ".local/share/fish/fish_history"
        - ".yep-anywhere"
        - ".quokka"
        - ".wallaby"
        - ".console-ninja"
        - ".warp"
        - ".lazyssh"
        - ".viminfo"
        - ".lesshst"
        - ".ansible"
        - ".zshrc.bkp"
        - ".zshenv.bkp"
        - ".profile.bkp"
        - "Library/Application Support/Cursor/User"
        - "Library/Application Support/Code/User"
        - "Library/Application Support/app.cotypist.Cotypist/cotypist.db"
        - "Library/Application Support/app.cotypist.Cotypist/cotypist.db-shm"
        - "Library/Application Support/app.cotypist.Cotypist/cotypist.db-wal"
        - "Library/Application Support/app.cotypist.Cotypist/Models/adapters"
        - "Library/Application Support/app.cotypist.Cotypist/completionStats.json"
        - "Library/Keychains/login.keychain-db"
      tag:
        - home
      schedule: "0,6,12,18:00"
      schedule-permission: user
      schedule-log: "{{ .Env.HOME }}/.local/share/resticprofile/logs/resticprofile-home.log"
      run-after:
        - "curl -fsS -m 10 --retry 5 https://hc-ping.com/84aa215e-8770-403a-abd7-9499e2b5a737"
      run-after-fail:
        - "curl -fsS -m 10 --retry 5 https://hc-ping.com/84aa215e-8770-403a-abd7-9499e2b5a737/fail"

  local-to-b2:
    inherit: local
    env-file: "{{ .Env.HOME }}/.config/resticprofile/b2.env"
    use:
      - name: remote-copy
        TARGET: b2
        HC_UUID: "bf672dd5-948d-44d6-94e7-c8460617347d"
        REPOSITORY: "b2:yoshintame:restic/main"

  local-to-gdrive:
    inherit: local
    use:
      - name: remote-copy
        TARGET: gdrive
        HC_UUID: "779e626c-f579-4e73-ab6d-b0a620fc854e"
        REPOSITORY: "rclone:gdrive:backups/restic/main"
    copy:
      option:
        - "rclone.program=/opt/homebrew/bin/rclone"

  local-ops:
    inherit: local
    forget:
      group-by: "host,tags"
      keep-within: 1d
      keep-daily: 14
      keep-weekly: 8
      keep-monthly: 6
      prune: true
      host: true
      tag: true
      schedule: "sun 4:00"
      schedule-permission: user
      schedule-log: "{{ .Env.HOME }}/.local/share/resticprofile/logs/resticprofile-local-ops-forget.log"
      run-after:
        - "curl -fsS -m 10 --retry 5 https://hc-ping.com/891cebfb-710b-487e-aaec-ddcafe63348d"
      run-after-fail:
        - "curl -fsS -m 10 --retry 5 https://hc-ping.com/891cebfb-710b-487e-aaec-ddcafe63348d/fail"
    check:
      schedule: "*-*-01 6:00"
      schedule-permission: user
      schedule-log: "{{ .Env.HOME }}/.local/share/resticprofile/logs/resticprofile-local-ops-check.log"
      run-after:
        - "curl -fsS -m 10 --retry 5 https://hc-ping.com/891cebfb-710b-487e-aaec-ddcafe63348d"
      run-after-fail:
        - "curl -fsS -m 10 --retry 5 https://hc-ping.com/891cebfb-710b-487e-aaec-ddcafe63348d/fail"

  b2-ops:
    inherit: b2
    use:
      - name: remote-ops
        TARGET: b2
        HC_UUID: "38d37c90-ac51-40ad-917c-2179cf03ba0b"
        FORGET_SCHEDULE: "sun 5:00"
        CHECK_SCHEDULE: "*-*-01 7:00"

  gdrive-ops:
    inherit: gdrive
    use:
      - name: remote-ops
        TARGET: gdrive
        HC_UUID: "0368d0c6-bce3-42fd-a76b-40db76e23a3f"
        FORGET_SCHEDULE: "sun 6:00"
        CHECK_SCHEDULE: "*-*-01 8:00"
